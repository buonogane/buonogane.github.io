<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buono's Odyssey — Books</title>

<meta name="description" content="Seeds of thought planted by books — the Books log at Buono's Odyssey.">
<meta name="keywords" content="Buono, Books, Reading, Reflections, Blog">
<meta name="author" content="Buono">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" href="gmb-fav-icon.png">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  color: #222;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

header {
  background: #111;
  color: #f5f0e6;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  padding: 1rem 2rem;
  flex-shrink: 0;
}
header a {
  text-decoration: none;
  color: #f5f0e6;
}
.brand-line {
  font-size: 1rem;
}
.brand-line .tagline {
  font-weight: 300;
  font-size: 0.85rem;
  letter-spacing: 0.5px;
  opacity: 0.85;
}
.breadcrumb {
  font-weight: 300;
  font-size: 0.8rem;
  margin-top: 0.5rem;
  letter-spacing: 0.3px;
}
.breadcrumb a {
  opacity: 0.75;
}
.breadcrumb .sep {
  margin: 0 0.35rem;
  opacity: 0.5;
}

main {
  flex: 1;
  padding: 2rem;
}

.page-title {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 2rem;
  max-width: 1100px;
  margin: 0 auto 1.5rem;
  text-align: left;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
  max-width: 1100px;
  margin: 0 auto;
}

.card {
  position: relative;
  min-height: 130px;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  color: #f5f0e6;
  background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('books/card-background-books-page.png');
  background-size: cover;
  background-position: center;
  padding: 1.25rem 1rem;
  text-align: center;
  transition: filter 0.2s ease, transform 0.2s ease;
}
.card:hover {
  filter: brightness(1.3);
  transform: translateY(-3px);
}

.card-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}
.card-content h2 {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 1.1rem;
}
.card-content p {
  margin: 0.5rem 0 0;
  font-weight: 300;
  font-size: 0.75rem;
  line-height: 1.3;
  max-width: 90%;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.card:hover .card-content p {
  opacity: 1;
  transform: translateY(0);
}

.empty-state {
  text-align: center;
  color: #555;
  font-size: 1rem;
  padding: 3rem 1rem;
}

footer {
  background: #111;
  color: #f5f0e6;
  text-align: center;
  padding: 1rem 2rem;
  font-size: 0.95rem;
  flex-shrink: 0;
}
footer p {
  margin: 0.4rem 0;
}
footer a {
  color: #f5f0e6;
  margin: 0 0.5rem;
  text-decoration: none;
}
footer img {
  width: 20px;
  height: 20px;
  vertical-align: middle;
}

@media (max-width: 900px) {
  header, footer { padding: 0.75rem 1.25rem; }
  main { padding: 1.25rem; }
  .card {
    min-height: 110px;
  }
  .card-content p {
    opacity: 1;
    transform: none;
  }
}
</style>
</head>
<body>

<header>
  <div class="brand-line">
    <a href="index.html">Buono's Odyssey</a>
    <span class="tagline">— where the seeds of my thoughts are planted.</span>
  </div>
  <div class="breadcrumb">
    <a href="index.html">Home</a>
    <span class="sep">/</span>
    <span>Books</span>
  </div>
</header>

<main>
  <h1 class="page-title">Books</h1>
  <div class="cards-grid" id="cards-grid"></div>
  <p class="empty-state" id="empty-state" style="display:none;">No entries yet. First book pending.</p>
</main>

<footer>
  <p>© 2025 Buonogane. We're only human.</p>
  <p>
    <a href="https://www.linkedin.com/in/ganendra-manggala-buono-a58375209/" target="_blank" rel="noopener noreferrer">
      <img src="linkedin.png" alt="LinkedIn">
    </a>
    <a href="https://www.instagram.com/buonogama/?next=%2F&hl=en" target="_blank" rel="noopener noreferrer">
      <img src="instagram.png" alt="Instagram">
    </a>
  </p>
</footer>

<script>
fetch('books/books-data.json')
  .then(res => {
    if (!res.ok) throw new Error('data file not found');
    return res.json();
  })
  .then(entries => {
    const grid = document.getElementById('cards-grid');
    const empty = document.getElementById('empty-state');
    if (!entries.length) {
      empty.style.display = 'block';
      return;
    }
    entries
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .forEach(entry => {
        const card = document.createElement('a');
        card.href = `books/${entry.slug}.html`;
        card.className = 'card';
        card.innerHTML = `
          <div class="card-content">
            <h2>${entry.title}</h2>
            <p>${entry.hook}</p>
          </div>`;
        grid.appendChild(card);
      });
  })
  .catch(() => {
    document.getElementById('empty-state').style.display = 'block';
  });
</script>

</body>
</html>
