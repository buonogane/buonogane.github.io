<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buono's Odyssey — Extras</title>

<meta name="description" content="Professional project write-ups and downloadable documents — the Extras collection at Buono's Odyssey.">
<meta name="keywords" content="Buono, Extras, Projects, Portfolio, Downloads">
<meta name="author" content="Buono">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  color: #222;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

header {
  background: #111;
  color: #f5f0e6;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  padding: 1rem 2rem;
  flex-shrink: 0;
}
header a {
  text-decoration: none;
  color: #f5f0e6;
}
.brand-line {
  font-size: 1rem;
}
.brand-line .tagline {
  font-weight: 300;
  font-size: 0.85rem;
  letter-spacing: 0.5px;
  opacity: 0.85;
}
.breadcrumb {
  font-weight: 300;
  font-size: 0.8rem;
  margin-top: 0.5rem;
  letter-spacing: 0.3px;
}
.breadcrumb a {
  opacity: 0.75;
}
.breadcrumb .sep {
  margin: 0 0.35rem;
  opacity: 0.5;
}

main {
  flex: 1;
  padding: 2rem;
}

.page-title {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 2rem;
  max-width: 900px;
  margin: 0 auto 1.5rem;
  text-align: left;
}

.cards-list {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  max-width: 900px;
  margin: 0 auto;
}

.card {
  background-color: #111;
  color: #f5f0e6;
  border-radius: 10px;
  padding: 1.75rem;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.card-body {
  flex: 1;
  min-width: 220px;
}
.card-body h2 {
  margin: 0 0 0.6rem;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 1.2rem;
}
.card-body .card-meta {
  font-size: 0.8rem;
  color: #aaa;
  margin-bottom: 0.6rem;
  letter-spacing: 0.4px;
}
.card-body p {
  margin: 0;
  font-weight: 300;
  font-size: 0.95rem;
  line-height: 1.6;
  color: #e8e2d6;
}

.download-btn {
  flex-shrink: 0;
  align-self: center;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background-color: #f5f0e6;
  color: #111;
  text-decoration: none;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  padding: 0.65rem 1.2rem;
  border-radius: 6px;
  transition: background-color 0.2s ease, transform 0.2s ease;
}
.download-btn:hover {
  background-color: #fff;
  transform: translateY(-2px);
}

.empty-state {
  text-align: center;
  color: #555;
  font-size: 1rem;
  padding: 3rem 1rem;
}

footer {
  background: #111;
  color: #f5f0e6;
  text-align: center;
  padding: 1rem 2rem;
  font-size: 0.95rem;
  flex-shrink: 0;
}
footer p {
  margin: 0.4rem 0;
}
footer a {
  color: #f5f0e6;
  margin: 0 0.5rem;
  text-decoration: none;
}
footer img {
  width: 20px;
  height: 20px;
  vertical-align: middle;
}

@media (max-width: 700px) {
  header, footer { padding: 0.75rem 1.25rem; }
  main { padding: 1.25rem; }
  .card {
    flex-direction: column;
    align-items: stretch;
  }
  .download-btn {
    align-self: stretch;
    justify-content: center;
  }
}
</style>
</head>
<body>

<header>
  <div class="brand-line">
    <a href="index.html">Buono's Odyssey</a>
    <span class="tagline">— quiet fragments and oddly specific fascinations.</span>
  </div>
  <div class="breadcrumb">
    <a href="index.html">Home</a>
    <span class="sep">/</span>
    <span>Extras</span>
  </div>
</header>

<main>
  <h1 class="page-title">Extras</h1>
  <div class="cards-list" id="cards-list"></div>
  <p class="empty-state" id="empty-state" style="display:none;">No documents yet. First upload pending.</p>
</main>

<footer>
  <p>© 2025 Buonogane. We're only human.</p>
  <p>
    <a href="https://www.linkedin.com/in/ganendra-manggala-buono-a58375209/" target="_blank" rel="noopener noreferrer">
      <img src="linkedin.png" alt="LinkedIn">
    </a>
    <a href="https://www.instagram.com/buonogama/?next=%2F&hl=en" target="_blank" rel="noopener noreferrer">
      <img src="instagram.png" alt="Instagram">
    </a>
  </p>
</footer>

<script>
fetch('extras/extras-data.json')
  .then(res => {
    if (!res.ok) throw new Error('data file not found');
    return res.json();
  })
  .then(entries => {
    const list = document.getElementById('cards-list');
    const empty = document.getElementById('empty-state');
    if (!entries.length) {
      empty.style.display = 'block';
      return;
    }
    entries
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .forEach(entry => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-body">
            <h2>${entry.title}</h2>
            <div class="card-meta">${entry.date}</div>
            <p>${entry.description}</p>
          </div>
          <a class="download-btn" href="extras/pdfs/${entry.file}" download>
            Download
          </a>`;
        list.appendChild(card);
      });
  })
  .catch(() => {
    document.getElementById('empty-state').style.display = 'block';
  });
</script>

</body>
</html>
