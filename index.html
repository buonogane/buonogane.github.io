/* --- DESIGN TOKENS --- */
:root {
  --bg-primary: #F4F3EF;
  --bg-surface: #FFFFFF;
  --text-primary: #1A1B1E;
  --text-secondary: #66686B;
  --text-muted: #8A8C8F;
  --border-subtle: rgba(26, 27, 30, 0.14);
  --accent-primary: #E62E2D;
  --accent-yellow: #F2B705;
  --dark-surface: #1A1B1E;
  --shadow-sm: 0 1px 2px rgba(26, 27, 30, 0.04);
  --shadow-md: 0 24px 48px -12px rgba(26, 27, 30, 0.08), 0 4px 16px -4px rgba(26, 27, 30, 0.03);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-primary);
  background-image: radial-gradient(rgba(26, 27, 30, 0.14) 0.9px, transparent 0.9px);
  background-size: 28px 28px;
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* --- TOP NAVIGATION --- */
.navbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  padding: clamp(0.85rem, 1.5vh, 1.15rem) clamp(1.25rem, 3vw, 2.5rem);
  background: rgba(244, 243, 239, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  text-decoration: none;
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: -0.04em;
  line-height: 1;
}

.brand-clown {
  display: inline-flex;
  align-items: center;
}

.brand-red-o {
  display: inline-block;
  width: 0.78em;
  height: 0.78em;
  border-radius: 50%;
  background-color: var(--accent-primary);
  margin: 0 0.04em;
  transform: translateY(-0.02em);
}

/* --- HERO STAGE --- */
.hero-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: clamp(1.25rem, 3vh, 2.25rem) clamp(1rem, 2.5vw, 2rem);
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  text-align: center;
}

.eyebrow-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.32rem 0.85rem;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 999px;
  font-size: 0.76rem;
  font-weight: 500;
  color: var(--text-secondary);
  box-shadow: var(--shadow-sm);
  margin-bottom: clamp(0.65rem, 1.5vh, 1rem);
}

.eyebrow-badge span.pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent-primary);
}

.hero-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: clamp(1.85rem, 3.8vw, 3rem);
  line-height: 1.1;
  letter-spacing: -0.035em;
  margin: 0 0 clamp(0.45rem, 1vh, 0.75rem);
  color: var(--text-primary);
}

.hero-subtitle {
  font-size: clamp(0.92rem, 1.3vw, 1.02rem);
  line-height: 1.55;
  color: var(--text-secondary);
  max-width: 500px;
  margin: 0 0 clamp(1.1rem, 2.5vh, 1.85rem);
}

/* --- SHOWCASE CONTAINER --- */
.showcase-frame {
  width: 100%;
  max-width: min(720px, 86vw);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 24px;
  padding: clamp(0.85rem, 2vh, 1.25rem) clamp(0.85rem, 2vw, 1.25rem) clamp(1.1rem, 2.2vh, 1.65rem);
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}

svg.clown-scene {
  width: 100%;
  height: auto;
  max-height: clamp(270px, 46vh, 430px);
  display: block;
  margin: 0 auto;
  overflow: visible;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* --- ORGANIC IDLE MOTION --- */
@keyframes floatIdle {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-4px); }
}

@keyframes pulseNose {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}

.silhouette-float {
  animation: floatIdle 5s ease-in-out infinite;
}

.clown-nose {
  transform-box: fill-box;
  transform-origin: center;
  animation: pulseNose 3.5s ease-in-out infinite;
}

/* --- INTERACTIVE TRIGGERS --- */
.interactive-group {
  cursor: pointer;
  outline: none;
}

.interactive-group .prop-group {
  transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  transform-box: fill-box;
  transform-origin: center bottom;
}

.interactive-group .cta-card {
  fill: var(--bg-surface);
  stroke: var(--border-subtle);
  stroke-width: 1.5;
  transition: all 0.25s ease;
  filter: drop-shadow(0 6px 14px rgba(26, 27, 30, 0.06));
}

.interactive-group .cta-title {
  fill: var(--text-primary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -0.01em;
  transition: fill 0.25s ease;
}

.interactive-group .cta-arrow {
  fill: var(--accent-primary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 15px;
  transition: transform 0.25s ease, fill 0.25s ease;
}

.interactive-group .cta-sub {
  fill: var(--text-secondary);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  font-size: 11px;
  transition: fill 0.25s ease;
}

/* Hover & Focus States */
.interactive-group.left-hand:hover .prop-group,
.interactive-group.left-hand:focus-visible .prop-group {
  transform: translateY(-7px) rotate(-2deg);
}

.interactive-group.right-hand:hover .prop-group,
.interactive-group.right-hand:focus-visible .prop-group {
  transform: translateY(-7px) rotate(2deg);
}

.interactive-group:hover .cta-card,
.interactive-group:focus-visible .cta-card {
  fill: var(--dark-surface);
  stroke: var(--dark-surface);
  filter: drop-shadow(0 12px 24px rgba(26, 27, 30, 0.16));
}

.interactive-group:hover .cta-title,
.interactive-group:focus-visible .cta-title {
  fill: #F4F3EF;
}

.interactive-group:hover .cta-sub,
.interactive-group:focus-visible .cta-sub {
  fill: #8A8C8F;
}

.interactive-group:hover .cta-arrow,
.interactive-group:focus-visible .cta-arrow {
  fill: var(--accent-yellow);
  transform: translateX(3px);
}

.interactive-group:active .prop-group {
  transform: translateY(-3px) scale(0.98);
}

/* --- FOOTER --- */
footer {
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  padding: clamp(0.85rem, 1.5vh, 1.15rem) clamp(1.25rem, 3vw, 2.5rem);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

footer p {
  margin: 0;
}

.social-links {

  align-items: center;
  gap: 0.85rem;

.social-links a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  text-decoration: none;
  transition: all 0.2s ease;
}

.social-links a:hover {
  background: var(--bg-primary);
  border-color: var(--text-muted);
  transform: translateY(-1px);
}

.social-links svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

/* --- RESPONSIVE DESIGN --- */
@media (max-width: 680px) {
  .showcase-frame {
    max-width: 100%;
    border-radius: 20px;
  }
  svg.clown-scene {
    max-height: 52vh;
  }
  .interactive-group .cta-title {
    font-size: 16px;
  }
  .interactive-group .cta-sub {
    font-size: 12px;
  }
  footer {
    flex-direction: column;
    gap: 0.75rem;
    text-align: center;
  }
}
